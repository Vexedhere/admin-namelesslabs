<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="color-scheme" content="dark">
<title>Nameless Labs · Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/theme.css">
<style>
body{display:none}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
aside{background:var(--bg2);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:11px;padding:4px 8px 22px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-weight:800;color:#fff;box-shadow:0 10px 26px -8px var(--a)}
.brand b{display:block;letter-spacing:-.01em}.brand small{color:var(--dim);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
nav{display:flex;flex-direction:column;gap:3px;flex:1}
nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--mute);cursor:pointer;font-weight:500;transition:.15s}
nav a:hover{background:var(--card);color:var(--text)}
nav a.on{background:linear-gradient(110deg,rgba(124,108,255,.2),rgba(34,211,238,.08));color:#fff;box-shadow:inset 0 0 0 1px rgba(124,108,255,.35)}
nav a i{font-style:normal;width:18px;text-align:center}
.me{border-top:1px solid var(--line);padding-top:14px;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;font-weight:700;color:#fff}
.me .av{flex:none}.me div:not(.av){flex:1;min-width:0}.me b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me small{color:var(--mute)}
main{padding:28px 34px 60px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
h1{font-size:26px;letter-spacing:-.025em}.top p{color:var(--mute);margin-top:2px}
.banner{margin-bottom:20px;padding:11px 14px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.28);color:var(--warn);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi,.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.22),transparent 70%)}
.kpi span{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi b{display:block;font-size:28px;letter-spacing:-.03em;margin:6px 0 2px}.kpi small{color:var(--dim)}
.row{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel h3{font-size:14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.panel h3 small{color:var(--dim);font-weight:400}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools .input{max-width:280px;padding:9px 12px}.tools select.input{max-width:170px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--card2)}
.empty{padding:34px;text-align:center;color:var(--dim)}
.who{display:flex;align-items:center;gap:10px}.who .av{width:30px;height:30px;font-size:12px}.who small{color:var(--dim);display:block;font-size:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.li:last-child{border:0}
.li small{color:var(--dim);display:block}
.bar{height:8px;background:var(--bg2);border-radius:8px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--a),var(--a2))}
.perm{display:flex;gap:6px;flex-wrap:wrap}
.menu{display:none;position:fixed;left:14px;top:14px;z-index:30}
code.k{background:var(--bg2);border:1px solid var(--line2);padding:1px 6px;border-radius:6px;font-family:var(--mono);font-size:12px}
ol.steps{padding-left:18px;color:var(--mute);display:flex;flex-direction:column;gap:8px}ol.steps b{color:var(--text)}
@media(max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.row,.row2{grid-template-columns:1fr}}
@media(max-width:760px){.app{grid-template-columns:1fr}aside{position:fixed;left:-270px;width:250px;z-index:25;transition:.25s}aside.open{left:0;box-shadow:0 0 0 100vmax rgba(0,0,0,.6)}.menu{display:block}main{padding:64px 16px 40px}}
</style>
</head>
<body>
<button class="btn menu" id="mb">☰</button>
<div class="app">
  <aside id="sb">
    <div class="brand"><div class="logo">N</div><div><b>Nameless Labs</b><small>Console</small></div></div>
    <nav id="nav"></nav><a href="moderation.html" style="display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--mute);font-weight:500;margin-top:6px">⚑ Moderation center</a>
    <div class="me"><div class="av" id="av"></div><div><b id="mn"></b><small id="mr"></small></div><button class="btn" id="lo" title="Sign out">⏻</button></div>
  </aside>
  <main id="main"></main>
</div>
<script src="assets/config.js"></script>
<script>
(()=>{
const C=window.NL_CONFIG;
const $=s=>document.querySelector(s);
/* ---------- session guard ---------- */
let S=null;try{S=JSON.parse(sessionStorage.getItem('nl_session')||'null')}catch{}
const out=()=>{sessionStorage.removeItem('nl_session');location.replace('./')};
if(!S||S.exp<Date.now()||Date.now()-S.last>C.IDLE_MINUTES*60e3)return out();
document.body.style.display='block';
const touch=()=>{S.last=Date.now();sessionStorage.setItem('nl_session',JSON.stringify(S))};
['click','keydown','mousemove','touchstart'].forEach(e=>addEventListener(e,()=>{if(Date.now()-S.last>15e3)touch()},{passive:true}));
setInterval(()=>{if(Date.now()>S.exp||Date.now()-S.last>C.IDLE_MINUTES*60e3)out()},20e3);
$('#lo').onclick=out;

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const ini=n=>String(n||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const dt=t=>t?new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const dd=t=>t?new Date(t).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const ago=t=>{if(!t)return'never';const m=(Date.now()-t)/6e4;if(m<1)return'just now';if(m<60)return Math.floor(m)+'m ago';if(m<1440)return Math.floor(m/60)+'h ago';return Math.floor(m/1440)+'d ago'};
const pill=(t,k)=>`<span class="pill ${k}">${esc(t)}</span>`;
const stPill=s=>pill(s,{active:'ok',trialing:'acc',past_due:'warn',cancelled:'bad',free:'mute'}[s]||'mute');
const who=(n,e)=>`<div class="who"><div class="av">${esc(ini(n))}</div><div>${esc(n)}<small>${esc(e)}</small></div></div>`;
const csv=(name,head,rows)=>{const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;const b=new Blob([[head,...rows].map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.csv';a.click()};

/* ---------- roles ---------- */
const ALL=['overview','customers','purchases','logins','team','setup'];
const ACCESS={'CEO':ALL,'Founder':ALL,'IT Admin':['overview','customers','logins','team','setup'],'CMO':['overview','customers','purchases','setup']};
const allowed=ACCESS[S.role]||['overview'];
const NAV=[['overview','◈','Overview'],['customers','◉','Customers'],['purchases','❖','Plan purchases'],['logins','⌁','Login activity'],['team','⚑','Team access'],['setup','⚙','Setup']];
$('#av').textContent=ini(S.name);$('#mn').textContent=S.name;$('#mr').textContent=S.role;
$('#nav').innerHTML=NAV.filter(n=>allowed.includes(n[0])).map(n=>`<a data-v="${n[0]}"><i>${n[1]}</i>${n[2]}</a>`).join('');
$('#mb').onclick=()=>$('#sb').classList.toggle('open');

/* ---------- data ---------- */
const live=S.mode==='supabase';
async function rest(t,q){
  const r=await fetch(`${C.SUPABASE_URL}/rest/v1/${t}?${q||''}`,{headers:{apikey:C.SUPABASE_ANON_KEY,Authorization:'Bearer '+S.token}});
  if(r.status===401)return out();
  if(!r.ok)throw new Error(t+': HTTP '+r.status);
  return r.json();
}
function demo(){
  let s=20260;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const pick=a=>a[Math.floor(R()*a.length)],now=Date.now(),day=864e5;
  const plans=[{id:1,name:'Starter',price:499},{id:2,name:'Pro',price:1499},{id:3,name:'Business',price:4999},{id:4,name:'Enterprise',price:14999}];
  const fn=['Aarav','Ananya','Rohit','Sneha','Karthik','Meera','Imran','Divya','Arjun','Priya','Suresh','Lakshmi','Vikram','Neha','Rahul','Pooja','Naveen','Swathi','Manoj','Harini','Teja','Sravani','Ravi','Bhavana'];
  const ln=['Reddy','Sharma','Naidu','Iyer','Khan','Patel','Rao','Menon','Gupta','Das','Varma','Nair'];
  const customers=[],subs=[],logins=[];
  for(let i=0;i<54;i++){
    const name=pick(fn)+' '+pick(ln),email=name.toLowerCase().replace(' ','.')+i+'@example.com';
    const created=now-R()*380*day,last=R()<.85?now-Math.pow(R(),2.2)*30*day:null;
    customers.push({id:'c'+i,name,email,created,lastLogin:last});
    if(R()<.72){const p=plans[Math.min(3,Math.floor(Math.pow(R(),1.7)*4))],r=R(),
      st=r<.68?'active':r<.8?'trialing':r<.9?'past_due':'cancelled';
      subs.push({id:'s'+i,uid:'c'+i,plan:p.name,amount:p.price,status:st,started:created+R()*(now-created)*.9,renews:now+R()*30*day});}
  }
  for(let i=0;i<190;i++){const c=pick(customers);logins.push({t:now-Math.pow(R(),2)*14*day,name:c.name,email:c.email,ok:R()<.9,ip:`${49+Math.floor(R()*150)}.${Math.floor(R()*255)}.${Math.floor(R()*255)}.${Math.floor(R()*255)}`,ua:pick(['Chrome · Windows','Safari · iPhone','Chrome · Android','Firefox · Linux','Edge · Windows','Safari · macOS'])})}
  return {customers,subs,logins};
}
async function load(){
  let d;
  if(live){
    const [pr,sb,pl,lg]=await Promise.all([
      rest('profiles','select=id,full_name,email,created_at,last_sign_in_at&order=created_at.desc&limit=2000'),
      rest('subscriptions','select=id,user_id,plan_id,status,amount_inr,started_at,renews_at&order=started_at.desc&limit=5000'),
      rest('plans','select=id,name,price_inr'),
      rest('login_events','select=id,email,full_name,success,ip,user_agent,created_at&order=created_at.desc&limit=1000')]);
    const pm=Object.fromEntries(pl.map(p=>[p.id,p.name]));
    d={customers:pr.map(c=>({id:c.id,name:c.full_name||c.email.split('@')[0],email:c.email,created:+new Date(c.created_at),lastLogin:c.last_sign_in_at?+new Date(c.last_sign_in_at):null})),
       subs:sb.map(x=>({id:x.id,uid:x.user_id,plan:pm[x.plan_id]||'Plan '+x.plan_id,amount:+x.amount_inr,status:x.status,started:+new Date(x.started_at),renews:x.renews_at?+new Date(x.renews_at):null})),
       logins:lg.map(x=>({t:+new Date(x.created_at),name:x.full_name||x.email,email:x.email,ok:x.success,ip:x.ip||'—',ua:(x.user_agent||'—').slice(0,40)}))};
  }else d=demo();
  const byU={};d.subs.forEach(x=>{(byU[x.uid]??=[]).push(x)});
  d.customers.forEach(c=>{const s=(byU[c.id]||[]).sort((a,b)=>b.started-a.started);const a=s.find(x=>x.status==='active'||x.status==='trialing'||x.status==='past_due')||s[0];
    c.plan=a?a.plan:'Free';c.status=a?a.status:'free';c.amount=a?a.amount:0;c.subs=s.length});
  const cm={};d.customers.forEach(c=>cm[c.id]=c);d.subs.forEach(x=>{x.name=cm[x.uid]?.name||'—';x.email=cm[x.uid]?.email||'—'});
  d.team=live?await rest('admin_roles','select=username,full_name,role').then(r=>r.map(x=>({user:x.username,name:x.full_name||x.username,role:x.role}))).catch(()=>[])
    :Object.entries(C.LOCAL_USERS).map(([k,v])=>({user:k,name:v.name,role:v.role}));
  if(!live){try{JSON.parse(localStorage.getItem('nl_login_log')||'[]').forEach(l=>d.logins.push({t:l.t,name:l.name+' (admin)',email:l.user+' · this browser',ok:l.ok,ip:'this device',ua:l.ua.slice(0,34),admin:l.user}))}catch{}}
  d.logins.sort((a,b)=>b.t-a.t);
  return d;
}

/* ---------- charts ---------- */
function barChart(vals,labels){
  const W=640,H=230,p={l:46,r:10,t:12,b:28},mx=Math.max(...vals,1),bw=(W-p.l-p.r)/vals.length;
  let g='';for(let i=0;i<=4;i++){const y=p.t+(H-p.t-p.b)*i/4;g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${y}" y2="${y}" stroke="#1f2536"/><text x="${p.l-8}" y="${y+4}" text-anchor="end" fill="#5d6580" font-size="10">${i===4?0:(mx*(4-i)/4>=1e5?(mx*(4-i)/4/1e5).toFixed(1)+'L':Math.round(mx*(4-i)/4/1000)+'k')}</text>`}
  const bars=vals.map((v,i)=>{const h=(H-p.t-p.b)*v/mx,x=p.l+i*bw+bw*.18,y=H-p.b-h;return `<rect x="${x}" y="${y}" width="${bw*.64}" height="${Math.max(h,1)}" rx="5" fill="url(#bg)"><title>${labels[i]}: ${inr(v)}</title></rect><text x="${x+bw*.32}" y="${H-10}" text-anchor="middle" fill="#5d6580" font-size="10">${labels[i]}</text>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c6cff"/></linearGradient></defs>${g}${bars}</svg>`;
}

/* ---------- views ---------- */
let D,view='overview';
const main=$('#main');
const head=(t,s,extra='')=>`<div class="top"><div><h1>${t}</h1><p>${s}</p></div><div>${extra}</div></div>${live?'':'<div class="banner">Demo data — connect Supabase (see Setup) to see real customers, plan purchases and logins. “Login activity” entries marked <b>this browser</b> are real sign-ins to this console.</div>'}`;

function months(){const a=[],n=new Date();for(let i=11;i>=0;i--){const d=new Date(n.getFullYear(),n.getMonth()-i,1);a.push({k:d.getFullYear()*12+d.getMonth(),l:d.toLocaleString('en-IN',{month:'short'})})}return a}

const V={};
V.overview=()=>{
  const act=D.subs.filter(x=>x.status==='active'||x.status==='past_due'),mrr=act.reduce((a,x)=>a+x.amount,0);
  const l24=D.logins.filter(x=>x.ok&&Date.now()-x.t<864e5).length,online=new Set(D.logins.filter(x=>x.ok&&Date.now()-x.t<9e5).map(x=>x.email)).size;
  const canRev=allowed.includes('purchases'),m=months();
  const rev=m.map(x=>D.subs.filter(s=>{const d=new Date(s.started);return d.getFullYear()*12+d.getMonth()===x.k&&s.status!=='cancelled'}).reduce((a,s)=>a+s.amount,0));
  const mix={};act.forEach(x=>mix[x.plan]=(mix[x.plan]||0)+1);const mt=Math.max(...Object.values(mix),1);
  main.innerHTML=head(`Good ${new Date().getHours()<12?'morning':new Date().getHours()<17?'afternoon':'evening'}, ${esc(S.name)}`,'Here’s what’s happening across Nameless Labs.')+
  `<div class="kpis">
    <div class="kpi"><span>Customers</span><b>${D.customers.length}</b><small>${D.customers.filter(c=>Date.now()-c.created<30*864e5).length} new in 30 days</small></div>
    <div class="kpi"><span>Active plans</span><b>${act.length}</b><small>${D.subs.filter(x=>x.status==='trialing').length} on trial · ${D.subs.filter(x=>x.status==='past_due').length} past due</small></div>
    <div class="kpi"><span>Monthly recurring</span><b>${canRev?inr(mrr):'—'}</b><small>${canRev?'from active plans':'restricted for your role'}</small></div>
    <div class="kpi"><span>Logins · 24h</span><b>${l24}</b><small>${online} active in last 15 min</small></div>
  </div>
  <div class="row">
    <div class="panel"><h3>Plan revenue by month <small>last 12 months</small></h3>${canRev?barChart(rev,m.map(x=>x.l)):'<div class="empty">Restricted for your role</div>'}</div>
    <div class="panel"><h3>Active plan mix</h3>${Object.keys(mix).length?Object.entries(mix).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div style="margin-bottom:14px"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span class="mono">${v}</span></div><div class="bar"><i style="width:${v/mt*100}%"></i></div></div>`).join(''):'<div class="empty">No active plans</div>'}</div>
  </div>
  <div class="row2">
    <div class="panel"><h3>Recent purchases</h3><div class="list">${canRev?D.subs.slice().sort((a,b)=>b.started-a.started).slice(0,6).map(x=>`<div class="li"><div>${esc(x.name)}<small>${esc(x.plan)} · ${dd(x.started)}</small></div><div style="text-align:right">${inr(x.amount)}<br>${stPill(x.status)}</div></div>`).join('')||'<div class="empty">None yet</div>':'<div class="empty">Restricted for your role</div>'}</div></div>
    <div class="panel"><h3>Recent logins</h3><div class="list">${D.logins.slice(0,6).map(x=>`<div class="li"><div>${esc(x.name)}<small>${esc(x.ua)} · ${ago(x.t)}</small></div>${pill(x.ok?'success':'failed',x.ok?'ok':'bad')}</div>`).join('')||'<div class="empty">No logins yet</div>'}</div></div>
  </div>`;
};

function tableView(id,title,sub,filters,cols,rowsFn,exportFn){
  main.innerHTML=head(title,sub,`<button class="btn" id="ex">⤓ Export CSV</button>`)+
  `<div class="tools"><input class="input" id="q" placeholder="Search…">${filters.map(f=>`<select class="input" id="${f.id}"><option value="">${f.label}</option>${f.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`).join('')}</div><div class="tw" id="tb"></div>`;
  const draw=()=>{const q=$('#q').value.toLowerCase(),fv=Object.fromEntries(filters.map(f=>[f.id,$('#'+f.id).value]));const rows=rowsFn(q,fv);
    $('#tb').innerHTML=rows.length?`<table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,300).map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">No results</div>';
    $('#ex').onclick=()=>exportFn(rows)};
  main.querySelectorAll('.input').forEach(e=>e.addEventListener('input',draw));draw();
}
V.customers=()=>tableView('customers','Customers',`${D.customers.length} registered · who’s on which plan`,
  [{id:'fp',label:'All plans',opts:['Free',...new Set(D.customers.map(c=>c.plan).filter(p=>p!=='Free'))]},{id:'fs',label:'All statuses',opts:['active','trialing','past_due','cancelled','free']}],
  [['Customer',c=>who(c.name,c.email)],['Plan',c=>pill(c.plan,c.plan==='Free'?'mute':'acc')],['Status',c=>stPill(c.status)],['Monthly',c=>c.amount?inr(c.amount):'—'],['Joined',c=>dd(c.created)],['Last login',c=>`${ago(c.lastLogin)}`]],
  (q,f)=>D.customers.filter(c=>(!q||(c.name+c.email).toLowerCase().includes(q))&&(!f.fp||c.plan===f.fp)&&(!f.fs||c.status===f.fs)).sort((a,b)=>(b.lastLogin||0)-(a.lastLogin||0)),
  r=>csv('customers',['Name','Email','Plan','Status','Monthly INR','Joined','Last login'],r.map(c=>[c.name,c.email,c.plan,c.status,c.amount,dd(c.created),c.lastLogin?new Date(c.lastLogin).toISOString():''])));
V.purchases=()=>tableView('purchases','Plan purchases','Every plan bought, with status and renewal',
  [{id:'fp',label:'All plans',opts:[...new Set(D.subs.map(s=>s.plan))]},{id:'fs',label:'All statuses',opts:['active','trialing','past_due','cancelled']}],
  [['Customer',s=>who(s.name,s.email)],['Plan',s=>pill(s.plan,'acc')],['Amount',s=>inr(s.amount)],['Status',s=>stPill(s.status)],['Purchased',s=>dd(s.started)],['Renews',s=>s.status==='cancelled'?'—':dd(s.renews)]],
  (q,f)=>D.subs.filter(s=>(!q||(s.name+s.email).toLowerCase().includes(q))&&(!f.fp||s.plan===f.fp)&&(!f.fs||s.status===f.fs)).sort((a,b)=>b.started-a.started),
  r=>csv('purchases',['Name','Email','Plan','Amount INR','Status','Purchased','Renews'],r.map(s=>[s.name,s.email,s.plan,s.amount,s.status,dd(s.started),dd(s.renews)])));
V.logins=()=>tableView('logins','Login activity','Every sign-in attempt, newest first',
  [{id:'fo',label:'All results',opts:['success','failed']}],
  [['User',l=>who(l.name,l.email)],['Result',l=>pill(l.ok?'success':'failed',l.ok?'ok':'bad')],['When',l=>`${dt(l.t)} <span style="color:var(--dim)">· ${ago(l.t)}</span>`],['Device',l=>esc(l.ua)],['IP',l=>`<span class="mono">${esc(l.ip)}</span>`]],
  (q,f)=>D.logins.filter(l=>(!q||(l.name+l.email+l.ip).toLowerCase().includes(q))&&(!f.fo||(f.fo==='success')===l.ok)),
  r=>csv('logins',['Name','Email','Success','Time','Device','IP'],r.map(l=>[l.name,l.email,l.ok,new Date(l.t).toISOString(),l.ua,l.ip])));
V.team=()=>{
  const P={'CEO':['Everything'],'Founder':['Everything'],'IT Admin':['Customers','Logins','Team','No revenue'],'CMO':['Customers','Purchases','No logins / team']};
  const last=u=>{const x=D.logins.find(l=>l.ok&&(l.admin===u.user||(l.email||'').startsWith(u.user+'@')));return x?x.t:null};
  main.innerHTML=head('Team access','Who can enter this console and what they can see')+
  `<div class="tw"><table><thead><tr><th>Member</th><th>Role</th><th>Can access</th><th>Last sign-in</th></tr></thead><tbody>${D.team.map(u=>`<tr><td>${who(u.name,u.user)}</td><td>${pill(u.role,'acc')}</td><td><div class="perm">${(P[u.role]||[]).map(p=>pill(p,'mute')).join('')}</div></td><td>${last(u)?ago(last(u)):'<span style="color:var(--dim)">never</span>'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No team found</td></tr>'}</tbody></table></div>`;
};
V.setup=()=>{
  const ok=live;
  main.innerHTML=head('Setup','Connection status and go-live checklist')+
  `<div class="panel" style="margin-bottom:14px"><h3>Data source ${pill(ok?'Supabase · live':'Demo data',ok?'ok':'warn')}</h3>
   <p style="color:var(--mute)">${ok?'You’re signed in through Supabase Auth. Every table below is protected by row-level security, so only users listed in <code class="k">admin_roles</code> can read it.':'Passwords are verified in your browser against salted PBKDF2 hashes in <code class="k">assets/config.js</code>. This keeps casual visitors out, but it is not real security: anyone can read page source. Real customer data must sit behind Supabase Auth.'}</p></div>
   <div class="panel"><h3>Go live in 5 steps</h3><ol class="steps">
    <li><b>Run</b> <code class="k">supabase/schema.sql</code> in Supabase → SQL Editor.</li>
    <li><b>Create 4 users</b> in Authentication → Users: <code class="k">chethan@${esc(C.EMAIL_DOMAIN)}</code>, <code class="k">vijay@…</code>, <code class="k">itadmin@…</code>, <code class="k">kedar@…</code> (tick “Auto confirm”). Use their passwords.</li>
    <li><b>Run</b> the “admin roles” block at the bottom of schema.sql to grant access.</li>
    <li><b>Paste</b> Project URL + anon key into <code class="k">assets/config.js</code> and push to GitHub.</li>
    <li><b>Point your customer app</b> at the same <code class="k">subscriptions</code> table so purchases appear here.</li></ol></div>`;
};

/* ---------- router ---------- */
function go(v){
  if(!allowed.includes(v))v='overview';view=v;
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  $('#sb').classList.remove('open');history.replaceState(null,'','#'+v);V[v]();scrollTo(0,0);
}
$('#nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a)go(a.dataset.v)});
main.innerHTML='<div class="empty" style="padding:80px">Loading…</div>';
load().then(d=>{D=d;go(location.hash.slice(1)||'overview')}).catch(e=>{main.innerHTML=`<div class="banner" style="color:var(--bad);background:rgba(251,113,133,.08);border-color:rgba(251,113,133,.3)">Could not load data: ${esc(e.message)}. Check the Supabase schema/RLS (Setup tab) and try again.</div>`});
})();
</script>
</body>
</html>
